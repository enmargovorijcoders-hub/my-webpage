<!DOCTYPE html>
<html>
<head>
  <title>Maintenance</title>
  <script>
(async function() {
  try {
    // Fetches status.txt from the same repository (prevents caching with timestamp)
    const res = await fetch('status.txt?t=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    
    if (text.trim().toLowerCase() === 'off') {
      if (window.location.pathname.endsWith('maintenance.html')) {
        window.location.href = 'index.html';
      }
    }
  } catch (e) {
    // Fail safe: leave site accessible if fetch fails
  }
})();
</script>
<meta http-equiv="refresh" content="30">
</head>
<body>
  <h1>Site is under maintenance.<h1>
<p>For now, check out the homepage without some functions:</p>
<a href="matinance_hompage.html">>Click Here<</a>
</body>
</html>
