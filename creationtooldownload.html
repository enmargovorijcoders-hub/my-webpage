<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barebones HTML Editor & Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: monospace;
            background: #fff;
            color: #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, label {
            padding: 5px 10px;
            background: #eee;
            border: 1px solid #999;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
        }
        button:hover, label:hover {
            background: #ddd;
        }
        input[type="file"] {
            display: none;
        }
        .main-container {
            display: flex;
            flex: 1;
            gap: 10px;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
        }
        .panel-header {
            background: #eee;
            padding: 5px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .assets-list {
            width: 220px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .asset-item {
            border: 1px solid #ddd;
            padding: 5px;
            font-size: 11px;
            word-break: break-all;
            background: #f9f9f9;
        }
        .asset-item.active {
            border-color: #000;
            background: #eee;
        }
        .asset-item button {
            width: 100%;
            margin-top: 3px;
            font-size: 10px;
            padding: 2px;
        }
    </style>
</head>
<body>

    <header>
        <button onclick="createNewHtmlFile()">New HTML File</button>
        <label>
            Add Image/Video
            <input type="file" id="fileInput" multiple accept="image/*,video/*" onchange="handleFiles(this.files)">
        </label>
        <button onclick="pickTargetFolder()" id="chooseFolderBtn" style="background: #eef; border-color: #77b;">Choose Folder</button>
        <button onclick="saveToChosenFolder()" id="downloadFolderBtn" style="background: #efe; border-color: #7b7;">Download Files</button>
        <span id="assetCountText" style="font-size: 12px; color: #555;">1 file(s)</span>
    </header>

    <div class="main-container">
        <!-- Asset & Files list sidebar -->
        <div class="assets-list" id="assetsList">
            <div style="font-size: 12px; font-weight: bold;">Project Files</div>
        </div>

        <!-- Plain HTML Textarea Editor (Zero autocorrect/autocomplete) -->
        <div class="panel">
            <div class="panel-header">
                <span id="currentFilenameTitle">index.html</span>
                <span style="font-size: 11px; color: #666;">No autocomplete/autocorrect</span>
            </div>
            <textarea 
                id="editor"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                data-gramm="false"
                data-gramm_editor="false"
                data-enable-grammarly="false"
                oninput="updateCurrentFileContent()"
                onkeyup="updateCurrentFileContent()"
                onpaste="setTimeout(updateCurrentFileContent, 10);"
                oncut="setTimeout(updateCurrentFileContent, 10);"
                placeholder="Type raw HTML here..."></textarea>
        </div>

        <!-- Live Preview Output -->
        <div class="panel">
            <div class="panel-header">
                <span>Preview</span>
                <button onclick="refreshPreview()" style="font-size: 10px; padding: 2px 6px;">Refresh Preview</button>
            </div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <script>
        // Project files structure: each file has a name and content
        let files = [
            { name: "index.html", content: "" }
        ];
        let currentFileIndex = 0;

        // Media assets (images, videos)
        let mediaAssets = [];

        // Chosen directory handle
        let targetDirectoryHandle = null;

        window.onload = function() {
            renderFileList();
            switchToFile(0);
        };

        // Warn user before full page reload or closing window
        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        };

        function createNewHtmlFile() {
            let filename = prompt("Enter new HTML filename (e.g. about.html):", "page2.html");
            if (!filename) return;
            filename = filename.replace(/[^a-zA-Z0-9_.-]/g, '_');
            if (!filename.endsWith('.html')) filename += '.html';

            if (files.some(f => f.name === filename)) {
                alert("A file with this name already exists.");
                return;
            }

            files.push({ name: filename, content: "" });
            renderFileList();
            switchToFile(files.length - 1);
        }

        function switchToFile(index) {
            currentFileIndex = index;
            const file = files[index];
            document.getElementById('editor').value = file.content;
            document.getElementById('currentFilenameTitle').textContent = file.name;
            renderFileList();
            updatePreview();
        }

        function updateCurrentFileContent() {
            files[currentFileIndex].content = document.getElementById('editor').value;
            updatePreview();
        }

        function refreshPreview() {
            updatePreview();
        }

        function updatePreview() {
            const currentFile = files[currentFileIndex];
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            
            let previewCode = currentFile.content;

            // 1. Replace media asset references with their live object URLs
            mediaAssets.forEach(asset => {
                const escapedName = asset.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regexSrc = new RegExp(`(src=["'])${escapedName}(["'])`, 'g');
                previewCode = previewCode.replace(regexSrc, `$1${asset.url}$2`);
            });

            // 2. Intercept <a> links pointing to other HTML files in the project so they switch tabs inside the editor/preview seamlessly
            files.forEach((f, fIdx) => {
                const escapedLinkName = f.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                
                // Handle href="filename.html" and href="./filename.html"
                const regexHref = new RegExp(`(href=["'])(?:\\./)?${escapedLinkName}(["'])`, 'g');
                previewCode = previewCode.replace(regexHref, `href="javascript:window.parent.switchToFile(${fIdx})"`);
            });

            doc.open();
            doc.write(previewCode);
            doc.close();
        }

        function handleFiles(uploadedFiles) {
            Array.from(uploadedFiles).forEach(file => {
                let name = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                if (mediaAssets.some(a => a.name === name) || files.some(f => f.name === name)) {
                    name = Date.now() + '_' + name;
                }
                mediaAssets.push({
                    name: name,
                    file: file,
                    url: URL.createObjectURL(file),
                    type: file.type.startsWith('image/') ? 'image' : 'video'
                });
            });
            renderFileList();
            updatePreview();
        }

        function renderFileList() {
            const list = document.getElementById('assetsList');
            document.getElementById('assetCountText').textContent = (files.length + mediaAssets.length) + " item(s)";
            
            let html = '<div style="font-size: 12px; font-weight: bold;">HTML Files</div>';
            files.forEach((file, idx) => {
                const isActive = idx === currentFileIndex;
                html += `
                    <div class="asset-item ${isActive ? 'active' : ''}">
                        <div style="cursor: pointer;" onclick="switchToFile(${idx})"><strong>${file.name}</strong> ${isActive ? '(Editing)' : ''}</div>
                        ${files.length > 1 && idx !== 0 ? `<button onclick="removeHtmlFile(${idx})">Delete</button>` : ''}
                        <button onclick="insertHtmlLink('${file.name}')">Insert Link</button>
                    </div>
                `;
            });

            html += '<div style="font-size: 12px; font-weight: bold; margin-top: 10px;">Media Assets</div>';
            if (mediaAssets.length === 0) {
                html += '<div style="font-size: 11px; color: #777;">No media uploaded.</div>';
            } else {
                mediaAssets.forEach((asset, idx) => {
                    html += `
                        <div class="asset-item">
                            <div><strong>${asset.name}</strong></div>
                            <button onclick="insertTag('${asset.name}', '${asset.type}')">Insert Tag</button>
                            <button onclick="removeAsset(${idx})">Remove</button>
                        </div>
                    `;
                });
            }

            list.innerHTML = html;
        }

        function insertTag(filename, type) {
            const ed = document.getElementById('editor');
            const tag = type === 'image' ? `<img src="${filename}" alt="">` : `<video src="${filename}" controls></video>`;
            const start = ed.selectionStart;
            ed.value = ed.value.substring(0, start) + tag + ed.value.substring(ed.selectionEnd);
            ed.selectionStart = ed.selectionEnd = start + tag.length;
            ed.focus();
            updateCurrentFileContent();
        }

        function insertHtmlLink(filename) {
            const ed = document.getElementById('editor');
            const tag = `<a href="${filename}">${filename}</a>`;
            const start = ed.selectionStart;
            ed.value = ed.value.substring(0, start) + tag + ed.value.substring(ed.selectionEnd);
            ed.selectionStart = ed.selectionEnd = start + tag.length;
            ed.focus();
            updateCurrentFileContent();
        }

        function removeHtmlFile(index) {
            if (files.length <= 1) return;
            files.splice(index, 1);
            switchToFile(0);
        }

        function removeAsset(index) {
            mediaAssets.splice(index, 1);
            renderFileList();
            updatePreview();
        }

        async function pickTargetFolder() {
            if (!('showDirectoryPicker' in window)) {
                alert("Directory Picker is not supported in this browser. Files will download directly via your browser download manager.");
                return;
            }

            try {
                targetDirectoryHandle = await window.showDirectoryPicker({
                    mode: 'readwrite'
                });
                
                const folderName = targetDirectoryHandle.name;
                const btn = document.getElementById('chooseFolderBtn');
                btn.textContent = "Folder: " + folderName;
                btn.style.background = "#dfd";
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.warn("Folder picker error:", err);
            }
        }

        async function saveToChosenFolder() {
            let saveDir = targetDirectoryHandle;

            if (saveDir && 'showDirectoryPicker' in window) {
                try {
                    const subFolderName = prompt("Enter project folder name inside your chosen directory:", "my_website");
                    if (subFolderName) {
                        const cleanName = subFolderName.replace(/[^a-zA-Z0-9_.-]/g, '_');
                        saveDir = await targetDirectoryHandle.getDirectoryHandle(cleanName, { create: true });
                    }

                    // Save all HTML files
                    for (const fileObj of files) {
                        const fileHandle = await saveDir.getFileHandle(fileObj.name, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(fileObj.content);
                        await writable.close();
                    }

                    // Save all media assets
                    for (const asset of mediaAssets) {
                        const fileHandle = await saveDir.getFileHandle(asset.name, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(asset.file);
                        await writable.close();
                    }

                    alert("All files saved successfully into your folder!");
                    return;
                } catch (err) {
                    console.warn("Write permission or directory error, falling back to direct downloads.", err);
                }
            }

            // Fallback: Direct downloads if no folder chosen or permission denied
            files.forEach((f, index) => {
                setTimeout(() => saveDirectFile(f.name, new Blob([f.content], { type: "text/html" })), index * 250);
            });
            mediaAssets.forEach((a, index) => {
                setTimeout(() => saveDirectFile(a.name, a.file), (files.length + index) * 250);
            });
        }

        function saveDirectFile(filename, blob) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
    </script>
</body>
</html>
